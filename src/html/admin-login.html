<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Viên - EduCourses Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo-chinh.svg">
</head>
<body class="trang-dang-nhap-quan-tri d-flex flex-column min-vh-100 justify-content-center py-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="../../index.html" class="d-inline-block mb-3">
                        <img src="../assets/images/logo-chinh.svg" alt="EduCourses Logo" class="anh-logo-chinh-dang-nhap">
                    </a>
                    <div class="text-info fw-semibold small text-uppercase">Cổng đăng nhập quản trị riêng biệt</div>
                </div>

                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white py-3 px-4 border-0 d-flex align-items-center justify-content-between">
                        <h1 class="h6 fw-bold mb-0"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Đăng Nhập Quản Trị (Admin)</h1>
                        <small class="badge bg-warning text-dark fw-semibold">Phiên độc lập</small>
                    </div>
                    <div class="card-body p-4 p-md-5 bg-white">
                        <form id="bieu-mau-dang-nhap-quan-tri">
                            <div class="mb-3">
                                <label for="email-dang-nhap-quan-tri" class="form-label fw-semibold">Email Quản trị viên</label>
                                <div class="input-group">
                                    <div class="input-group-text bg-light"><i class="bi bi-envelope-fill text-primary"></i></div>
                                    <input type="email" class="form-control" id="email-dang-nhap-quan-tri" placeholder="admin@gmail.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="mat-khau-dang-nhap-quan-tri" class="form-label fw-semibold">Mật khẩu Quản trị</label>
                                <div class="input-group">
                                    <div class="input-group-text bg-light"><i class="bi bi-key-fill text-primary"></i></div>
                                    <input type="password" class="form-control" id="mat-khau-dang-nhap-quan-tri" placeholder="Nhập mật khẩu quản trị" required>
                                    <button type="button" class="btn btn-outline-secondary nut-hien-mat-khau" data-o-nhap-muc-tieu="mat-khau-dang-nhap-quan-tri" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="o-nhap-ma-xac-thuc-quan-tri" class="form-label fw-semibold">Mã xác thực Captcha</label>
                                <div class="row g-2 align-items-center">
                                    <div class="col-5">
                                        <div id="hien-thi-ma-xac-thuc-quan-tri" class="p-2 text-center fw-bold fs-5 border hop-ma-xac-thuc">ADM26</div>
                                    </div>
                                    <div class="col-2">
                                        <button type="button" id="nut-doi-ma-xac-thuc-quan-tri" class="btn btn-outline-secondary w-100" title="Đổi mã Captcha khác" aria-label="Đổi mã Captcha khác">
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </button>
                                    </div>
                                    <div class="col-5">
                                        <input type="text" class="form-control" id="o-nhap-ma-xac-thuc-quan-tri" placeholder="Nhập mã" required>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Vào Trang Quản Trị
                            </button>
                        </form>

                        <div class="d-flex justify-content-between align-items-center small pt-2 border-top">
                            <a href="../../index.html" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i>Về trang chủ</a>
                            <a href="login.html" class="text-decoration-none fw-semibold">Đăng nhập Học viên <i class="bi bi-arrow-right ms-1"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-login.js"></script>
</body>
</html>
